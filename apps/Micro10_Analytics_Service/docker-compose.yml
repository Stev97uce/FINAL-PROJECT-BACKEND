version: '3.8'

services:
  analytics-service:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: uce_analytics_service
    ports:
      - "8009:8009"
    environment:
      - APP_NAME=Analytics Service
      - APP_VERSION=1.0.0
      - ENVIRONMENT=development
      - PORT=8009
      - DEBUG=true
      
      - MONGODB_HOST=uce_mongodb
      - MONGODB_PORT=27017
      - MONGODB_USER=root
      - MONGODB_PASSWORD=rootpassword
      - MONGODB_DATABASE=analytics_db
      - MONGODB_AUTH_SOURCE=admin
      
      - REDIS_HOST=uce_redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=
      - REDIS_DB=0
      
      - RABBITMQ_HOST=uce_rabbitmq
      - RABBITMQ_PORT=5672
      - RABBITMQ_USER=guest
      - RABBITMQ_PASSWORD=guest
      - RABBITMQ_VHOST=/
      - RABBITMQ_EXCHANGE=uce_events
      
      - JWT_SECRET_KEY=your-super-secret-key-change-in-production
      - JWT_ALGORITHM=HS256
      
      - AUTH_SERVICE_URL=http://uce_auth_service:8000
      - USER_SERVICE_URL=http://uce_user_service:8001
      - PATIENT_SERVICE_URL=http://uce_patient_service:8002
      - APPOINTMENT_SERVICE_URL=http://uce_appointment_service:8003
      - ROOM_SERVICE_URL=http://uce_room_service:8004
      - CLINICAL_SERVICE_URL=http://uce_clinical_service:8005
      - SUPERVISION_SERVICE_URL=http://uce_supervision_service:8006
      - NOTIFICATION_SERVICE_URL=http://uce_notification_service:8007
      - REPORTING_SERVICE_URL=http://uce_reporting_service:8008
      
      - CORS_ORIGINS=http://localhost:3000,http://localhost:5173
    networks:
      - uce_network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:8009/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

networks:
  uce_network:
    external: true
    name: final-project-backend_uce_network

