version: '3.8'

services:
  analytics-service:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: uce_analytics_service
    ports:
      - "8009:8009"
    environment:
      - APP_NAME=Analytics Service
      - APP_VERSION=1.0.0
      - ENVIRONMENT=development
      - PORT=8009
      - DEBUG=true
      
      - MONGODB_HOST=mongodb
      - MONGODB_PORT=27017
      - MONGODB_USER=root
      - MONGODB_PASSWORD=root123
      - MONGODB_DATABASE=analytics_db
      - MONGODB_AUTH_SOURCE=admin
      
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=
      - REDIS_DB=0
      
      - RABBITMQ_HOST=rabbitmq
      - RABBITMQ_PORT=5672
      - RABBITMQ_USER=guest
      - RABBITMQ_PASSWORD=guest
      - RABBITMQ_VHOST=/
      - RABBITMQ_EXCHANGE=uce_events
      
      - JWT_SECRET_KEY=your-super-secret-key-change-in-production
      - JWT_ALGORITHM=HS256
      
      - AUTH_SERVICE_URL=http://host.docker.internal:8000
      - USER_SERVICE_URL=http://host.docker.internal:8001
      - PATIENT_SERVICE_URL=http://host.docker.internal:8002
      - APPOINTMENT_SERVICE_URL=http://host.docker.internal:8003
      - ROOM_SERVICE_URL=http://host.docker.internal:8004
      - CLINICAL_SERVICE_URL=http://host.docker.internal:8005
      - SUPERVISION_SERVICE_URL=http://host.docker.internal:8006
      - NOTIFICATION_SERVICE_URL=http://host.docker.internal:8007
      - REPORTING_SERVICE_URL=http://host.docker.internal:8008
      
      - CORS_ORIGINS=http://localhost:3000,http://localhost:5173
    depends_on:
      mongodb:
        condition: service_started
      redis:
        condition: service_started
      rabbitmq:
        condition: service_started
    networks:
      - uce_network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:8009/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  mongodb:
    image: mongo:6.0
    container_name: uce_mongodb_analytics
    ports:
      - "27027:27017"
    environment:
      - MONGO_INITDB_ROOT_USERNAME=root
      - MONGO_INITDB_ROOT_PASSWORD=root123
      - MONGO_INITDB_DATABASE=analytics_db
    volumes:
      - mongodb_data:/data/db
    networks:
      - uce_network
    restart: unless-stopped

  redis:
    image: redis:7.0-alpine
    container_name: uce_redis_analytics
    ports:
      - "6389:6379"
    volumes:
      - redis_data:/data
    networks:
      - uce_network
    restart: unless-stopped

  rabbitmq:
    image: rabbitmq:3.12-management-alpine
    container_name: uce_rabbitmq_analytics
    ports:
      - "5682:5672"
      - "15682:15672"
    environment:
      - RABBITMQ_DEFAULT_USER=guest
      - RABBITMQ_DEFAULT_PASS=guest
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    networks:
      - uce_network
    restart: unless-stopped

volumes:
  mongodb_data:
  redis_data:
  rabbitmq_data:

networks:
  uce_network:
    driver: bridge
