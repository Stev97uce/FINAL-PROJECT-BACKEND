version: '3.8'

services:
  appointment_service:
    build: .
    container_name: uce_appointment_service
    image: stevxd97/uce-appointment-service:latest
    ports:
      - "8003:8003"
    environment:
      # Server
      APP_NAME: "Appointment Service"
      APP_VERSION: "1.0.0"
      ENVIRONMENT: "development"
      PORT: "8003"
      DEBUG: "true"
      
      # Database (PostgreSQL from shared instance)
      DB_HOST: postgresql
      DB_PORT: "5432"
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_NAME: appointment_db
      DB_SSLMODE: disable
      
      # Redis (from shared instance)
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      REDIS_PASSWORD: ""
      REDIS_DB: "0"
      
      # RabbitMQ (from shared instance)
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: "5672"
      RABBITMQ_USER: guest
      RABBITMQ_PASSWORD: guest
      RABBITMQ_VHOST: "/"
      RABBITMQ_EXCHANGE: uce_events
      
      # JWT
      JWT_SECRET_KEY: "your-secret-key-change-in-production"
      JWT_ALGORITHM: "HS256"
      
      # External Services
      AUTH_SERVICE_URL: "http://auth_service:8000"
      USER_SERVICE_URL: "http://user_service:8001"
      PATIENT_SERVICE_URL: "http://patient_service:8002"
      ROOM_SERVICE_URL: "http://room_service:8004"
      
      # CORS
      CORS_ORIGINS: "http://localhost:3000,http://localhost:5173"
    networks:
      - appointment_network
    depends_on:
      appointment_postgres:
        condition: service_healthy
      appointment_redis:
        condition: service_healthy
      appointment_rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8003/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    restart: unless-stopped

  appointment_postgres:
    image: postgres:14-alpine
    container_name: uce_appointment_postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: appointment_db
    ports:
      - "5434:5432"
    volumes:
      - appointment_postgres_data:/var/lib/postgresql/data
    networks:
      - appointment_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  appointment_redis:
    image: redis:7-alpine
    container_name: uce_appointment_redis
    ports:
      - "6381:6379"
    volumes:
      - appointment_redis_data:/data
    networks:
      - appointment_network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  appointment_rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: uce_appointment_rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    ports:
      - "5674:5672"
      - "15674:15672"
    volumes:
      - appointment_rabbitmq_data:/var/lib/rabbitmq
    networks:
      - appointment_network
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

networks:
  appointment_network:
    driver: bridge

volumes:
  appointment_postgres_data:
  appointment_redis_data:
  appointment_rabbitmq_data:
