name: Supervision Service CI/CD

on:
  push:
    branches: [ qa, main, production ]
    paths:
      - 'apps/Micro7_Supervision_Service/**'
      - '.github/workflows/supervision-service.yml'
  pull_request:
    branches: [ qa, main ]
    paths:
      - 'apps/Micro7_Supervision_Service/**'

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          
      - name: Install dependencies
        working-directory: apps/Micro7_Supervision_Service
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt
          
      - name: Run tests with pytest
        working-directory: apps/Micro7_Supervision_Service
        run: |
          pytest tests/ -v --cov=app --cov-report=term-missing
          
      - name: Upload coverage reports
        uses: codecov/codecov-action@v4
        with:
          files: ./apps/Micro7_Supervision_Service/coverage.xml
          flags: supervision-service
          name: supervision-service-coverage

  build:
    name: Build and Push Docker Image
    needs: test
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
          
      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: stevxd97/uce-supervision-service
          tags: |
            type=ref,event=branch
            type=sha,prefix={{branch}}-
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            
      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: ./apps/Micro7_Supervision_Service
          push: true
          tags: |
            stevxd97/uce-supervision-service:latest
            stevxd97/uce-supervision-service:${{ github.ref_name }}
          cache-from: type=registry,ref=stevxd97/uce-supervision-service:buildcache
          cache-to: type=registry,ref=stevxd97/uce-supervision-service:buildcache,mode=max

  deploy-qa:
    name: Deploy to QA
    needs: build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/qa'
    
    steps:
      - name: Deploy to QA environment
        run: |
          echo "Deploying Supervision Service to QA"
          # Add deployment commands here
          
  deploy-production:
    name: Deploy to Production
    needs: build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/production'
    environment: production
    
    steps:
      - name: Deploy to Production environment
        run: |
          echo "Deploying Supervision Service to Production"
          # Add deployment commands here
