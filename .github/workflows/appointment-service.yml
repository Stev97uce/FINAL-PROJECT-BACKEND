name: Appointment Service CI/CD

on:
  push:
    branches: [ main, develop, qa ]
    paths:
      - 'apps/Micro4_Appointment_Service/**'
      - '.github/workflows/appointment-service.yml'
  pull_request:
    branches: [ main, develop, qa ]
    paths:
      - 'apps/Micro4_Appointment_Service/**'

jobs:
  test:
    name: Test Appointment Service
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.21'
      
      - name: Cache Go modules
        uses: actions/cache@v4
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: ${{ runner.os }}-go-${{ hashFiles('apps/Micro4_Appointment_Service/go.mod') }}
          restore-keys: |
            ${{ runner.os }}-go-
      
      - name: Install dependencies
        working-directory: apps/Micro4_Appointment_Service
        run: |
          go mod tidy
          go mod download
          go mod verify
      
      - name: Run go vet
        working-directory: apps/Micro4_Appointment_Service
        run: go vet ./...
      
      - name: Run tests
        working-directory: apps/Micro4_Appointment_Service
        run: go test ./... -v -coverprofile=coverage.out
      
      - name: Upload coverage
        uses: codecov/codecov-action@v4
        with:
          file: ./apps/Micro4_Appointment_Service/coverage.out
          flags: appointment-service
          fail_ci_if_error: false
  
  build:
    name: Build and Push Docker Image
    needs: test
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/qa')
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      
      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      
      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ secrets.DOCKERHUB_USERNAME }}/uce-appointment-service
          tags: |
            type=ref,event=branch
            type=sha,prefix={{branch}}-
            type=raw,value=latest,enable={{is_default_branch}}
      
      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: ./apps/Micro4_Appointment_Service
          file: ./apps/Micro4_Appointment_Service/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
