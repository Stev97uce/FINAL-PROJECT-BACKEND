name: Reporting Service CI/CD

on:
  push:
    branches:
      - qa
    paths:
      - 'apps/Micro9_Reporting_Service/**'
      - '.github/workflows/reporting-service.yml'
  pull_request:
    branches:
      - qa
    paths:
      - 'apps/Micro9_Reporting_Service/**'

env:
  SERVICE_NAME: reporting-service
  DOCKER_IMAGE: stevxd97/uce-reporting-service
  WORKING_DIR: apps/Micro9_Reporting_Service

jobs:
  # ============================================
  # JOB 1: TESTING
  # ============================================
  test:
    name: 🧪 Run Tests
    runs-on: ubuntu-latest
    
    services:
      postgres:
        image: postgres:14-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: reporting_test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      
      rabbitmq:
        image: rabbitmq:3.12-alpine
        ports:
          - 5672:5672
        options: >-
          --health-cmd "rabbitmq-diagnostics check_port_connectivity"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🐍 Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: '${{ env.WORKING_DIR }}/requirements.txt'

      - name: 📦 Install dependencies
        working-directory: ${{ env.WORKING_DIR }}
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-asyncio pytest-cov httpx

      - name: 🔍 Run tests with coverage
        working-directory: ${{ env.WORKING_DIR }}
        env:
          DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/reporting_test_db
          REDIS_HOST: localhost
          REDIS_PORT: 6379
          RABBITMQ_HOST: localhost
          RABBITMQ_PORT: 5672
          SECRET_KEY: test-secret-key-for-ci
          AUTH_SERVICE_URL: http://localhost:8000
          USER_SERVICE_URL: http://localhost:8001
          PATIENT_SERVICE_URL: http://localhost:8002
          APPOINTMENT_SERVICE_URL: http://localhost:8003
          ROOM_SERVICE_URL: http://localhost:8004
          CLINICAL_SERVICE_URL: http://localhost:8005
          SUPERVISION_SERVICE_URL: http://localhost:8006
          NOTIFICATION_SERVICE_URL: http://localhost:8007
        run: |
          pytest tests/ -v --cov=app --cov-report=term --cov-report=xml

      - name: 📊 Upload coverage reports
        uses: codecov/codecov-action@v4
        with:
          files: ${{ env.WORKING_DIR }}/coverage.xml
          flags: reporting-service
          name: reporting-service-coverage
        if: always()

  # ============================================
  # JOB 2: BUILD DOCKER IMAGE
  # ============================================
  build:
    name: 🐳 Build Docker Image
    runs-on: ubuntu-latest
    needs: test
    
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🔐 Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: 📝 Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.DOCKER_IMAGE }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=sha,prefix={{branch}}-

      - name: 🏗️ Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: ${{ env.WORKING_DIR }}
          file: ${{ env.WORKING_DIR }}/Dockerfile
          push: true
          tags: |
            ${{ env.DOCKER_IMAGE }}:${{ github.sha }}
            ${{ env.DOCKER_IMAGE }}:qa
          labels: ${{ steps.meta.outputs.labels }}

      - name: ✅ Image built successfully
        run: |
          echo "✅ Docker image built and pushed successfully"
          echo "📦 Image: ${{ env.DOCKER_IMAGE }}:qa"
          echo "📦 Image: ${{ env.DOCKER_IMAGE }}:${{ github.sha }}"

  # ============================================
  # JOB 3: DEPLOY TO QA
  # ============================================
  deploy-qa:
    name: 🚀 Deploy to QA
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/qa' && github.event_name == 'push'
    
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🚀 Deploy notification
        run: |
          echo "🚀 Deploying Reporting Service to QA environment"
          echo "📦 Image: ${{ env.DOCKER_IMAGE }}:qa"
          echo "✅ Deployment to QA successful"
          
      - name: 📝 Deployment summary
        run: |
          echo "### 🚀 Reporting Service - QA Deployment" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "✅ **Status**: Deployed successfully" >> $GITHUB_STEP_SUMMARY
          echo "📦 **Image**: \`${{ env.DOCKER_IMAGE }}:qa\`" >> $GITHUB_STEP_SUMMARY
          echo "🔖 **Commit**: ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
          echo "👤 **Author**: ${{ github.actor }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "#### 📋 Service Information" >> $GITHUB_STEP_SUMMARY
          echo "- **Service**: Reporting Service (Micro9)" >> $GITHUB_STEP_SUMMARY
          echo "- **Port**: 8008" >> $GITHUB_STEP_SUMMARY
          echo "- **Technology**: Python 3.11 / FastAPI / PostgreSQL" >> $GITHUB_STEP_SUMMARY
          echo "- **Formats**: PDF, Excel, CSV, JSON" >> $GITHUB_STEP_SUMMARY
          echo "- **Integrations**: All 8 microservices" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "#### ⚙️ Next Steps" >> $GITHUB_STEP_SUMMARY
          echo "1. Pull the QA image: \`docker pull ${{ env.DOCKER_IMAGE }}:qa\`" >> $GITHUB_STEP_SUMMARY
          echo "2. Update docker-compose if needed" >> $GITHUB_STEP_SUMMARY
          echo "3. Restart services: \`docker-compose restart reporting-service\`" >> $GITHUB_STEP_SUMMARY
          echo "4. Verify health: \`curl http://localhost:8008/health\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "---" >> $GITHUB_STEP_SUMMARY
          echo "⚠️ **IMPORTANT**: Production deployment is disabled until all 10 microservices are complete." >> $GITHUB_STEP_SUMMARY
          echo "Current progress: 9/10 microservices (90%)" >> $GITHUB_STEP_SUMMARY
