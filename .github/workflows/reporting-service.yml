name: Reporting Service CI/CD

on:
  push:
    branches:
      - qa
    paths:
      - 'apps/Micro9_Reporting_Service/**'
      - '.github/workflows/reporting-service.yml'
  pull_request:
    branches:
      - qa
    paths:
      - 'apps/Micro9_Reporting_Service/**'

env:
  SERVICE_NAME: reporting-service
  DOCKER_IMAGE: stevxd97/uce-reporting-service
  WORKING_DIR: apps/Micro9_Reporting_Service

jobs:
  # ============================================
  # JOB 1: TESTING
  # ============================================
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    
    services:
      postgres:
        image: postgres:14-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: reporting_test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      
      rabbitmq:
        image: rabbitmq:3.12-alpine
        ports:
          - 5672:5672
        options: >-
          --health-cmd "rabbitmq-diagnostics check_port_connectivity"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: '${{ env.WORKING_DIR }}/requirements.txt'

      - name: Install dependencies
        working-directory: ${{ env.WORKING_DIR }}
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-asyncio pytest-cov httpx

      - name: Run tests with coverage
        working-directory: ${{ env.WORKING_DIR }}
        env:
          DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/reporting_test_db
          REDIS_HOST: localhost
          REDIS_PORT: 6379
          RABBITMQ_HOST: localhost
          RABBITMQ_PORT: 5672
          SECRET_KEY: test-secret-key-for-ci
          AUTH_SERVICE_URL: http://localhost:8000
          USER_SERVICE_URL: http://localhost:8001
          PATIENT_SERVICE_URL: http://localhost:8002
          APPOINTMENT_SERVICE_URL: http://localhost:8003
          ROOM_SERVICE_URL: http://localhost:8004
          CLINICAL_SERVICE_URL: http://localhost:8005
          SUPERVISION_SERVICE_URL: http://localhost:8006
          NOTIFICATION_SERVICE_URL: http://localhost:8007
        run: |
          pytest tests/ -v --cov=app --cov-report=term --cov-report=xml

      - name: Upload coverage reports
        uses: codecov/codecov-action@v4
        with:
          files: ${{ env.WORKING_DIR }}/coverage.xml
          flags: reporting-service
          name: reporting-service-coverage
        if: always()
        continue-on-error: true

  # ============================================
  # JOB 2: BUILD DOCKER IMAGE
  # ============================================
  build:
    name: Build Docker Image
    needs: test
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/qa'
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
        continue-on-error: true
            
      - name: Build and push to QA
        uses: docker/build-push-action@v5
        with:
          context: ./apps/Micro9_Reporting_Service
          push: true
          tags: |
            stevxd97/uce-reporting-service:qa
            stevxd97/uce-reporting-service:latest
          cache-from: type=registry,ref=stevxd97/uce-reporting-service:buildcache
          cache-to: type=registry,ref=stevxd97/uce-reporting-service:buildcache,mode=max
        continue-on-error: true

  # ============================================
  # JOB 3: DEPLOY TO QA
  # ============================================
  deploy-qa:
    name: Deploy to QA Environment
    needs: build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/qa'
    
    steps:
      - name: Notify QA Deployment
        run: |
          echo "Deploying Reporting Service to QA"
          echo "Image: stevxd97/uce-reporting-service:qa"
          echo "Deployment completed successfully"
