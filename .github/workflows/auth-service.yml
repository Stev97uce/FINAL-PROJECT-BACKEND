name: Auth Service CI/CD

on:
  push:
    branches: [ main, develop, qa ]
    paths:
      - 'apps/Micro1_Auth_Service/**'
      - '!apps/Micro1_Auth_Service/**/*.md'
      - '.github/workflows/auth-service.yml'
  pull_request:
    branches: [ main, develop, qa ]
    paths:
      - 'apps/Micro1_Auth_Service/**'
      - '!apps/Micro1_Auth_Service/**/*.md'
  workflow_dispatch:

env:
  SERVICE_NAME: auth-service
  DOCKER_IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}/uce-auth-service
  WORKING_DIR: apps/Micro1_Auth_Service

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root123
          MYSQL_DATABASE: auth_db
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
      
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
      
      rabbitmq:
        image: rabbitmq:3-management-alpine
        ports:
          - 5672:5672
        env:
          RABBITMQ_DEFAULT_USER: guest
          RABBITMQ_DEFAULT_PASS: guest
        options: >-
          --health-cmd="rabbitmq-diagnostics -q ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up Node.js (for Turbo)
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        cache: 'npm'
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
    
    - name: Install root dependencies (Turbo)
      run: npm install
    
    - name: Wait for services to be ready
      run: |
        echo "Waiting for MySQL..."
        for i in {1..30}; do
          if mysqladmin ping -h 127.0.0.1 -P 3306 -u root -proot123 --silent; then
            echo "MySQL is ready!"
            break
          fi
          echo "Waiting for MySQL to be ready... ($i/30)"
          sleep 2
        done
        
        echo "Waiting for Redis..."
        for i in {1..30}; do
          if redis-cli -h 127.0.0.1 -p 6379 ping; then
            echo "Redis is ready!"
            break
          fi
          echo "Waiting for Redis to be ready... ($i/30)"
          sleep 2
        done
    
    - name: Initialize database
      run: |
        mysql -h 127.0.0.1 -P 3306 -u root -proot123 -e "CREATE DATABASE IF NOT EXISTS auth_db CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci;"
        mysql -h 127.0.0.1 -P 3306 -u root -proot123 auth_db < apps/Micro1_Auth_Service/database_setup.sql || echo "Database already initialized"
    
    - name: Run tests with Turbo
      env:
        DB_HOST: 127.0.0.1
        DB_PORT: 3306
        DB_USER: root
        DB_PASSWORD: root123
        DB_NAME: auth_db
        REDIS_HOST: 127.0.0.1
        REDIS_PORT: 6379
        RABBITMQ_HOST: 127.0.0.1
        RABBITMQ_PORT: 5672
        RABBITMQ_USER: guest
        RABBITMQ_PASSWORD: guest
        JWT_SECRET_KEY: test-secret-key-for-ci-testing
        JWT_ALGORITHM: HS256
      run: |
        cd apps/Micro1_Auth_Service
        pip install -r requirements.txt
        pip install -r requirements-dev.txt
        
        # Export environment variables explicitly for pytest
        export DB_HOST=127.0.0.1
        export DB_PORT=3306
        export DB_USER=root
        export DB_PASSWORD=root123
        export DB_NAME=auth_db
        export REDIS_HOST=127.0.0.1
        export REDIS_PORT=6379
        export RABBITMQ_HOST=127.0.0.1
        export RABBITMQ_PORT=5672
        export RABBITMQ_USER=guest
        export RABBITMQ_PASSWORD=guest
        export JWT_SECRET_KEY=test-secret-key-for-ci-testing
        export JWT_ALGORITHM=HS256
        
        cd ../..
        npx turbo run test --filter=Micro1_Auth_Service
    
    - name: Upload coverage reports
      uses: codecov/codecov-action@v3
      with:
        file: ./apps/Micro1_Auth_Service/coverage.xml
        flags: auth-service
        name: auth-service-coverage

  build-and-push:
    name: Build and Push Docker Image
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop')
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3
    
    - name: Log in to Docker Hub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}
    
    - name: Extract metadata
      id: meta
      uses: docker/metadata-action@v5
      with:
        images: ${{ env.DOCKER_IMAGE }}
        tags: |
          type=ref,event=branch
          type=sha,prefix={{branch}}-
          type=raw,value=latest,enable={{is_default_branch}}
    
    - name: Build and push Docker image
      uses: docker/build-push-action@v5
      with:
        context: ${{ env.WORKING_DIR }}
        file: ${{ env.WORKING_DIR }}/Dockerfile
        push: true
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}
        cache-from: type=registry,ref=${{ env.DOCKER_IMAGE }}:buildcache
        cache-to: type=registry,ref=${{ env.DOCKER_IMAGE }}:buildcache,mode=max

