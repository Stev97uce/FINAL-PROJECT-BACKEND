name: Patient Service CI/CD

on:
  push:
    branches: [ main, develop, qa ]
    paths:
      - 'apps/Micro3_Patient_Service/**'
      - '.github/workflows/patient-service.yml'
  pull_request:
    branches: [ main, develop, qa ]
    paths:
      - 'apps/Micro3_Patient_Service/**'

jobs:
  test:
    name: Test Patient Service
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Python 3.11
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      
      - name: Cache Python dependencies
        uses: actions/cache@v3
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-patient-${{ hashFiles('apps/Micro3_Patient_Service/requirements*.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-patient-
      
      - name: Install dependencies
        working-directory: apps/Micro3_Patient_Service
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt
      
      - name: Set up Node.js (for TurboRepo)
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      
      - name: Install TurboRepo
        run: npm install
      
      - name: Run tests with TurboRepo
        run: npx turbo test --filter=patient-service
        env:
          DB_HOST: localhost
          DB_PORT: 5432
          DB_USER: postgres
          DB_PASSWORD: test
          DB_NAME: test_patient_db
          REDIS_HOST: localhost
          REDIS_PORT: 6379
          RABBITMQ_HOST: localhost
          RABBITMQ_PORT: 5672
          RABBITMQ_USER: guest
          RABBITMQ_PASSWORD: guest
          JWT_SECRET_KEY: test-secret-key-for-ci
          AUTH_SERVICE_URL: http://localhost:8000
          USER_SERVICE_URL: http://localhost:8001
      
      - name: Upload coverage reports
        uses: codecov/codecov-action@v3
        if: always()
        with:
          files: ./apps/Micro3_Patient_Service/coverage.xml
          flags: patient-service
          name: patient-service-coverage
  
  build:
    name: Build and Push Docker Image
    needs: test
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/qa')
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      
      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      
      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ secrets.DOCKERHUB_USERNAME }}/uce-patient-service
          tags: |
            type=ref,event=branch
            type=sha,prefix={{branch}}-
            type=raw,value=latest,enable={{is_default_branch}}
      
      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./apps/Micro3_Patient_Service
          file: ./apps/Micro3_Patient_Service/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      
      - name: Image digest
        run: echo "Image pushed with tags: ${{ steps.meta.outputs.tags }}"

