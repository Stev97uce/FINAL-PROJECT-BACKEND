name: Deploy Auth Service to QA

on:
  push:
    branches:
      - qa
    paths:
      - 'apps/Micro1_Auth_Service/**'
      - '.github/workflows/deploy-auth-qa.yml'

env:
  SERVICE_NAME: auth-service
  DOCKER_IMAGE: ucepsychology/auth-service
  EC2_HOST: 10.1.1.10
  SERVICE_PORT: 8000

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    
    steps:
      # ===================================
      # 1. Checkout código
      # ===================================
      - name: Checkout code
        uses: actions/checkout@v4

      # ===================================
      # 2. Setup Docker Buildx
      # ===================================
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # ===================================
      # 3. Login a DockerHub
      # ===================================
      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # ===================================
      # 4. Extract metadata (tags, labels)
      # ===================================
      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.DOCKER_IMAGE }}
          tags: |
            type=raw,value=latest
            type=sha,prefix={{branch}}-

      # ===================================
      # 5. Build y Push Docker image
      # ===================================
      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./apps/Micro1_Auth_Service
          file: ./apps/Micro1_Auth_Service/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=registry,ref=${{ env.DOCKER_IMAGE }}:buildcache
          cache-to: type=registry,ref=${{ env.DOCKER_IMAGE }}:buildcache,mode=max

      # ===================================
      # 6. Deploy a EC2 via SSH
      # ===================================
      - name: Deploy to EC2
        env:
          BASTION_HOST: ${{ secrets.BASTION_HOST }}
          BASTION_USER: ubuntu
          BASTION_SSH_KEY: ${{ secrets.BASTION_SSH_KEY }}
          EC2_USER: ubuntu
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
        run: |
          # Guardar SSH keys en archivos temporales
          echo "$BASTION_SSH_KEY" > bastion_key.pem
          echo "$EC2_SSH_KEY" > ec2_key.pem
          chmod 600 bastion_key.pem ec2_key.pem
          
          # Crear SSH config para ProxyJump
          cat > ssh_config <<EOF
          Host bastion
            HostName $BASTION_HOST
            User $BASTION_USER
            IdentityFile bastion_key.pem
            StrictHostKeyChecking no
            UserKnownHostsFile /dev/null
          
          Host target
            HostName $EC2_HOST
            User $EC2_USER
            IdentityFile ec2_key.pem
            ProxyJump bastion
            StrictHostKeyChecking no
            UserKnownHostsFile /dev/null
          EOF
          
          # Deployment commands via SSH
          ssh -F ssh_config target << 'ENDSSH'
            set -e
            
            echo "🔄 Pulling latest image..."
            docker pull ${{ env.DOCKER_IMAGE }}:latest
            
            echo "⏹️  Stopping current container..."
            docker stop ${{ env.SERVICE_NAME }} || true
            docker rm ${{ env.SERVICE_NAME }} || true
            
            echo "🚀 Starting new container..."
            docker run -d \
              --name ${{ env.SERVICE_NAME }} \
              --network host \
              --env-file /opt/${{ env.SERVICE_NAME }}/.env \
              --restart unless-stopped \
              ${{ env.DOCKER_IMAGE }}:latest
            
            echo "🧹 Cleaning up old images..."
            docker system prune -af --filter "until=24h"
            
            echo "✅ Deployment completed!"
            docker ps | grep ${{ env.SERVICE_NAME }}
          ENDSSH
          
          # Limpiar archivos temporales
          rm -f bastion_key.pem ec2_key.pem ssh_config

      # ===================================
      # 7. Health Check
      # ===================================
      - name: Health check
        env:
          BASTION_HOST: ${{ secrets.BASTION_HOST }}
          BASTION_USER: ubuntu
          BASTION_SSH_KEY: ${{ secrets.BASTION_SSH_KEY }}
        run: |
          echo "$BASTION_SSH_KEY" > bastion_key.pem
          chmod 600 bastion_key.pem
          
          # Wait for service to start
          sleep 10
          
          # Health check via Bastion tunnel
          ssh -i bastion_key.pem \
            -o StrictHostKeyChecking=no \
            -o UserKnownHostsFile=/dev/null \
            $BASTION_USER@$BASTION_HOST \
            "curl -f http://$EC2_HOST:$SERVICE_PORT/health || exit 1"
          
          echo "✅ Service is healthy!"
          rm -f bastion_key.pem

      # ===================================
      # 8. Notificación (opcional)
      # ===================================
      - name: Notify deployment
        if: success()
        run: |
          echo "✅ ${{ env.SERVICE_NAME }} deployed successfully to QA!"
          echo "Image: ${{ env.DOCKER_IMAGE }}:latest"
          echo "Host: ${{ env.EC2_HOST }}:${{ env.SERVICE_PORT }}"
