version: '3.8'

# ============================================================
# DOCKER COMPOSE GLOBAL - UCE PSICOLOGÍA BACKEND
# ============================================================
# Este archivo levanta TODOS los servicios del proyecto
# para desarrollo local
# ============================================================

services:
  # ===================================
  # BASES DE DATOS (Simulan Cuenta 1)
  # ===================================
  
  mysql:
    image: mysql:8.0
    container_name: uce_mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: auth_service_db
      MYSQL_USER: authuser
      MYSQL_PASSWORD: authpassword
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./apps/Micro1_Auth_Service/database_setup.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-prootpassword"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - uce_network

  postgresql:
    image: postgres:14-alpine
    container_name: uce_postgresql
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: user_service_db
    ports:
      - "5432:5432"
    volumes:
      - postgresql_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - uce_network

  mongodb:
    image: mongo:6.0
    container_name: uce_mongodb
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: rootpassword
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - uce_network

  redis:
    image: redis:7-alpine
    container_name: uce_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - uce_network

  # ===================================
  # MESSAGE BROKERS
  # ===================================
  
  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: uce_rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    ports:
      - "5672:5672"   # AMQP
      - "15672:15672" # Management UI
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - uce_network

  # ===================================
  # MICROSERVICIO 1: AUTH SERVICE
  # ===================================
  
  auth-service:
    build:
      context: ./apps/Micro1_Auth_Service
      dockerfile: Dockerfile
    container_name: uce_auth_service
    restart: unless-stopped
    environment:
      # Database
      DB_HOST: mysql
      DB_PORT: 3306
      DB_USER: authuser
      DB_PASSWORD: authpassword
      DB_NAME: auth_service_db
      # JWT
      JWT_SECRET_KEY: development-secret-key-change-in-production
      JWT_ALGORITHM: HS256
      JWT_ACCESS_TOKEN_EXPIRE_MINUTES: 1440
      JWT_REFRESH_TOKEN_EXPIRE_DAYS: 7
      # RabbitMQ
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USER: guest
      RABBITMQ_PASSWORD: guest
      RABBITMQ_EXCHANGE: uce_events
      # App
      APP_ENV: development
      APP_HOST: 0.0.0.0
      APP_PORT: 8000
    ports:
      - "8000:8000"
    depends_on:
      mysql:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - uce_network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ===================================
  # MICROSERVICIO 2: USER SERVICE
  # ===================================
  
  user-service:
    build:
      context: ./apps/Micro2_User_Service
      dockerfile: Dockerfile
    container_name: uce_user_service
    restart: unless-stopped
    environment:
      # Database
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_HOST: postgresql
      DB_PORT: 5432
      DB_NAME: user_service_db
      # Redis
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_DB: 1
      # RabbitMQ
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USER: guest
      RABBITMQ_PASSWORD: guest
      # JWT (must match auth-service)
      JWT_SECRET_KEY: Q7v1P7Rp-vglhy04pduFZ0LeHW-_z9eBqSPwEV_2Ea4
      JWT_ALGORITHM: HS256
      # Service
      SERVICE_NAME: user-service
      SERVICE_PORT: 8001
      AUTH_SERVICE_URL: http://auth-service:8000
      ENVIRONMENT: development
    ports:
      - "8001:8001"
    depends_on:
      postgresql:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - uce_network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ===================================
  # MICROSERVICIO 3: PATIENT SERVICE
  # ===================================
  
  patient_service:
    build:
      context: ./apps/Micro3_Patient_Service
      dockerfile: Dockerfile
    image: stevxd97/uce-patient-service:latest
    container_name: uce_patient_service
    restart: unless-stopped
    ports:
      - "8002:8002"
    environment:
      APP_NAME: "Patient Service"
      APP_VERSION: "1.0.0"
      HOST: "0.0.0.0"
      PORT: 8002
      DEBUG: "false"
      ENVIRONMENT: "production"
      
      DB_HOST: postgresql
      DB_PORT: 5432
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_NAME: patient_db
      
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_DB: 2
      REDIS_PASSWORD: ""
      
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USER: guest
      RABBITMQ_PASSWORD: guest
      RABBITMQ_EXCHANGE: "uce_events"
      
      JWT_SECRET_KEY: "${JWT_SECRET_KEY:-your-super-secret-key-change-in-production}"
      JWT_ALGORITHM: "HS256"
      
      AUTH_SERVICE_URL: "http://auth_service:8000"
      USER_SERVICE_URL: "http://user_service:8001"
      
      CORS_ORIGINS: '["http://localhost:3000","http://localhost:3001"]'
    
    depends_on:
      postgresql:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - uce_network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8002/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # ===================================
  # MICROSERVICIO 4: APPOINTMENT SERVICE (GO)
  # ===================================
  
  appointment_service:
    build:
      context: ./apps/Micro4_Appointment_Service
      dockerfile: Dockerfile
    container_name: uce_appointment_service
    image: stevxd97/uce-appointment-service:latest
    ports:
      - "8003:8003"
    environment:
      APP_NAME: "Appointment Service"
      APP_VERSION: "1.0.0"
      ENVIRONMENT: "development"
      PORT: "8003"
      DEBUG: "true"
      
      DB_HOST: postgresql
      DB_PORT: "5432"
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_NAME: appointment_db
      DB_SSLMODE: disable
      
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      REDIS_PASSWORD: ""
      REDIS_DB: "0"
      
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: "5672"
      RABBITMQ_USER: guest
      RABBITMQ_PASSWORD: guest
      RABBITMQ_VHOST: "/"
      RABBITMQ_EXCHANGE: uce_events
      
      JWT_SECRET_KEY: "${JWT_SECRET_KEY:-your-super-secret-key-change-in-production}"
      JWT_ALGORITHM: "HS256"
      
      AUTH_SERVICE_URL: "http://auth_service:8000"
      USER_SERVICE_URL: "http://user_service:8001"
      PATIENT_SERVICE_URL: "http://patient_service:8002"
      ROOM_SERVICE_URL: "http://room_service:8004"
      
      CORS_ORIGINS: "http://localhost:3000,http://localhost:5173"
    
    depends_on:
      postgresql:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - uce_network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8003/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # ===================================
  # MICROSERVICIO 5: ROOM SERVICE (GO)
  # ===================================
  
  room_service:
    build:
      context: ./apps/Micro5_Room_Service
      dockerfile: Dockerfile
    container_name: uce_room_service
    image: stevxd97/uce-room-service:latest
    ports:
      - "8004:8004"
    environment:
      APP_NAME: "Room Service"
      APP_VERSION: "1.0.0"
      ENVIRONMENT: "development"
      PORT: "8004"
      DEBUG: "true"
      
      DB_HOST: postgresql
      DB_PORT: "5432"
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_NAME: room_db
      DB_SSLMODE: disable
      
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      REDIS_PASSWORD: ""
      REDIS_DB: "0"
      
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: "5672"
      RABBITMQ_USER: guest
      RABBITMQ_PASSWORD: guest
      RABBITMQ_VHOST: "/"
      RABBITMQ_EXCHANGE: uce_events
      
      JWT_SECRET_KEY: "Q7v1P7Rp-vglhy04pduFZ0LeHW-_z9eBqSPwEV_2Ea4"
      JWT_ALGORITHM: "HS256"
      
      AUTH_SERVICE_URL: "http://auth_service:8000"
      USER_SERVICE_URL: "http://user_service:8001"
      PATIENT_SERVICE_URL: "http://patient_service:8002"
      APPOINTMENT_SERVICE_URL: "http://appointment_service:8003"
      
      CORS_ORIGINS: "http://localhost:3000,http://localhost:5173"
    depends_on:
      postgresql:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8004/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - uce_network

  # ===================================
  # MICROSERVICIO 6: CLINICAL SERVICE (Python)
  # ===================================
  
  clinical_service:
    build:
      context: ./apps/Micro6_Clinical_Service
      dockerfile: Dockerfile
    container_name: uce_clinical_service
    image: stevxd97/uce-clinical-service:latest
    ports:
      - "8005:8005"
    environment:
      SERVICE_NAME: "clinical-service"
      SERVICE_VERSION: "1.0.0"
      PORT: 8005
      DEBUG: "false"
      
      MONGODB_URL: "mongodb://root:rootpassword@mongodb:27017"
      MONGODB_DB_NAME: "clinical_db"
      
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_DB: 3
      REDIS_PASSWORD: ""
      
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USER: guest
      RABBITMQ_PASSWORD: guest
      RABBITMQ_EXCHANGE: "uce_events"
      
      SECRET_KEY: "Q7v1P7Rp-vglhy04pduFZ0LeHW-_z9eBqSPwEV_2Ea4"
      ALGORITHM: "HS256"
      ACCESS_TOKEN_EXPIRE_MINUTES: 30
      
      CORS_ORIGINS: '["http://localhost:3000","http://localhost:3001"]'
    
    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - uce_network
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8005/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # ===================================
  # MICROSERVICIO 7: SUPERVISION SERVICE
  # ===================================
  
  supervision_service:
    build:
      context: ./apps/Micro7_Supervision_Service
      dockerfile: Dockerfile
    image: stevxd97/uce-supervision-service:latest
    container_name: uce_supervision_service
    restart: unless-stopped
    ports:
      - "8006:8006"
    environment:
      DEBUG: "False"
      DATABASE_URL: postgresql://postgres:postgres@postgresql:5432/supervision_db
      REDIS_HOST: redis
      REDIS_PORT: 6379
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USER: guest
      RABBITMQ_PASSWORD: guest
      SECRET_KEY: your-secret-key-change-in-production-supervision-service-2025
      ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: 60
    depends_on:
      postgresql:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - uce_network
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8006/health').read()"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # ===================================
  # HERRAMIENTAS DE DESARROLLO
  # ===================================
  
  adminer:
    image: adminer:latest
    container_name: uce_adminer
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      ADMINER_DEFAULT_SERVER: mysql
    depends_on:
      - mysql
      - postgresql
    networks:
      - uce_network

# VOLUMENES PERSISTENTES

volumes:
  mysql_data:
    driver: local
  postgresql_data:
    driver: local
  mongodb_data:
    driver: local
  redis_data:
    driver: local
  rabbitmq_data:
    driver: local

# ===================================
# RED COMPARTIDA
# ===================================

networks:
  uce_network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16

# ===================================
# COMANDOS ÚTILES
# ===================================
# 
# Levantar todos los servicios:
#   docker-compose up -d
#
# Levantar solo bases de datos y message broker:
#   docker-compose up -d mysql postgresql mongodb redis rabbitmq
#
# Levantar Auth Service:
#   docker-compose up -d auth-service
#
# Ver logs:
#   docker-compose logs -f auth-service
#
# Detener todo:
#   docker-compose down
#
# Detener y eliminar volúmenes (⚠️ CUIDADO: Borra datos):
#   docker-compose down -v
#umenes (
# Reconstruir imágenes:
#   docker-compose build --no-cache
#
# Acceder a MySQL:
#   docker exec -it uce_mysql mysql -u root -prootpassword
#
# Acceder a PostgreSQL:
#   docker exec -it uce_postgresql psql -U postgres
#
# Acceder a MongoDB:
#   docker exec -it uce_mongodb mongosh -u root -p rootpassword
#
# Acceder a RabbitMQ Management:
#   http://localhost:15672 (guest/guest)
#
# Acceder a Adminer:
#   http://localhost:8080
#
# ===================================
